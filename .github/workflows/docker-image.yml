name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        # ❌ Eliminado: filter: blob:none

    - name: Git Semantic Version
      uses: paulhatch/semantic-version@v5.4.0  # ✅ Versión actualizada
      with:
        tag_prefix: "v"
        major_pattern: "major"
        minor_pattern: "feat:"
        version_format: "${major}.${minor}.${patch}-prerelease${increment}"  # ✅ version_format en v5
        bump_each_commit: true
        version_from_branch: false  # ✅ Usar commits, no el nombre del branch
      id: version

    - name: Docker Login & Build
      env:
        DOCKER_USER: ${{ secrets.DOCKER_USER }}
        DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        NEW_VERSION: ${{ steps.version.outputs.version }}
        DOCKER_CONTAINER: ${{ vars.DOCKER_CONTAINER }}
      run: |
        docker login -u $DOCKER_USER -p $DOCKER_PASSWORD
        echo "New Version: $NEW_VERSION"
        # docker build -t $DOCKER_CONTAINER:$NEW_VERSION .
        # docker push $DOCKER_CONTAINER:$NEW_VERSION
